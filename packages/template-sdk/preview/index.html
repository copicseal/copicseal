<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copicseal 远程模板 · 打包产物预览</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161c;
        --panel: #1c1f27;
        --line: #2b2f3a;
        --text: #e8eaf0;
        --muted: #9aa2b1;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #root { height: 100vh; }
      .app { display: flex; height: 100vh; min-height: 0; }
      .side { width: 260px; flex: none; border-right: 1px solid var(--line); overflow: auto; }
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .props { width: 320px; flex: none; border-left: 1px solid var(--line); overflow: auto; }
      .block { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .block h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
      .item { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; background: none; color: inherit; cursor: pointer; }
      .item:hover { background: #232733; }
      .item[aria-current="true"] { border-color: var(--accent); background: #1f2735; }
      .item small { color: var(--muted); }
      .viewport { flex: 1; min-height: 0; overflow: auto; padding: 24px; display: flex; align-items: flex-start; justify-content: center;
        background-image: linear-gradient(45deg, #191c23 25%, transparent 25%), linear-gradient(-45deg, #191c23 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #191c23 75%), linear-gradient(-45deg, transparent 75%, #191c23 75%);
        background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; }
      input, select, button, textarea {
        font: inherit; color: var(--text); background: #20242e; border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 7px;
      }
      input[type="range"] { width: 100%; padding: 0; }
      input[type="color"] { width: 32px; height: 24px; padding: 0; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .frame { isolation: isolate; }
      .field { margin-bottom: 10px; }
      .field > label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); margin-bottom: 4px; }
      .field input[type="text"], .field input[type="number"], .field select { width: 100%; }
      .row { display: flex; align-items: center; gap: 8px; }
      .row.between { justify-content: space-between; }
      .muted { color: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; word-break: break-all; }
      .error { border: 1px solid #7f3b3b; background: #2a1c1c; color: #ffb4b4; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
      .warn { color: #ffd479; }
      .tag { display: inline-block; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; margin: 0 4px 4px 0; color: var(--muted); font-size: 11px; }
      details pre { margin: 6px 0 0; max-height: 240px; overflow: auto; }
      .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #262b36; border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
