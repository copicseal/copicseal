[package]
name = "Copicseal"
version = "0.4.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copicseal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
dirs = "6"
kamadak-exif = "0.6"
font-kit = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zune-core = "0.5"
zune-jpeg = "0.5"
base64 = "0.23.1"
# flate2_rust：纯 Rust 解压后端，避免 libz-sys 在 Windows 打包机上引入 C 工具链依赖
allsorts = { version = "0.17.0", default-features = false, features = ["flate2_rust"] }
# 插件系统：下载/校验/解压（reqwest / sha2 / zip 都已在锁文件里，此处只是提升为直接依赖）
# system-proxy：Clash 这类工具只写 Windows 系统代理、不设环境变量，GUI 进程因此拿不到
# HTTP_PROXY；打开这个特性才能沿用系统代理下载
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "system-proxy",
] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 构造更新清单地址（UpdaterBuilder::endpoints 只收 Url）
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
] }

# ---------------------------------------------------------------------------
# 构建档位
# ---------------------------------------------------------------------------
# 图片解码 / 重采样 / JPEG 编码都是纯 Rust 的大循环：debug（opt-level = 0）比 release
# 慢一个数量级，开发时「压缩一张图要好几秒」主要就是这个原因。
#
# 只给图像处理相关的 crate 打开优化（它们编译一次就缓存，增量编译不受影响），
# 本 crate 轻度优化。**不要写成 `package."*"`**：那会连 C/C++ 依赖的编译参数一起改，
# 已经踩过 `vswhom-sys` 构建失败的坑。
[profile.dev]
opt-level = 2

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.kamadak-exif]
opt-level = 3

