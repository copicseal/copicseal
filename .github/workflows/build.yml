name: Build

# 可复用打包流程：由 release.yml / beta.yml 针对每个平台与架构调用一次。
on:
  workflow_call:
    inputs:
      label:
        description: 产物标识，用于 artifact 名称
        required: true
        type: string
      platform:
        description: GitHub 托管运行器标签
        required: true
        type: string
      target:
        description: Rust 目标三元组
        required: true
        type: string
      bundles:
        description: tauri build 的 --bundles 取值
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ inputs.label }}
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 90
    # DMG 安装窗口的背景图与图标落点不是配置文件直接生效的：打包时由 Finder 用 AppleScript
    # 写进镜像里的 .DS_Store。Tauri 检测到 CI=true 会默认跳过这步（--skip-jenkins），
    # 产出的 DMG 只剩一个白底窗口（.background/background.png 还在，但没人引用它）。
    # GitHub 托管的 macOS 运行器有完整 GUI 会话，可以正常执行，因此显式要求不要跳过。
    env:
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # Linux 打包依赖：Tauri v2 用 webkit2gtk-4.1；字体子系统（font-kit）需要
      # fontconfig / freetype 的 pkg-config 文件；AppImage 打包期间要执行 linuxdeploy
      # （Ubuntu 22.04+ 默认没有 FUSE2，缺 libfuse2 会失败）。
      - name: 安装 Linux 打包依赖
        if: startsWith(inputs.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            patchelf \
            libfuse2

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ inputs.target }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 标签发布以标签为准，分支构建沿用 package.json 的版本号。
      - name: 同步版本号
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            pnpm sync:version "${GITHUB_REF_NAME#v}"
          else
            pnpm sync:version
          fi
          echo "::notice::本次打包版本 $(node -p "require('./package.json').version")"

      - name: 代码风格检查
        run: pnpm run ci

      # 更新包签名密钥缺失时降级：仍然产出安装包，但不产出 .sig 与 latest.json。
      - name: 检查更新包签名密钥
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::未配置 TAURI_SIGNING_PRIVATE_KEY，本次跳过签名更新包与 latest.json"
            exit 0
          fi
          if grep -q 'PENDING_RELEASE_KEY' src-tauri/tauri.conf.json; then
            echo "::error::已配置签名密钥，但 plugins.updater.pubkey 仍是占位符，请替换为 pnpm tauri signer generate 输出的公钥"
            exit 1
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      # 拆成两步而不是给同一步骤加条件 env：Tauri 以"环境变量是否存在"为判断依据，
      # 注入空字符串会走到私钥解码失败。
      - name: 打包安装包（含签名更新包）
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 私钥没有密码时 GitHub 会把未创建的 secret 展开成空串；Tauri 以"变量是否存在"
          # 判断要不要解密私钥，空串会解密失败，所以这里显式 unset。
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          pnpm tauri build --target ${{ inputs.target }} --bundles ${{ inputs.bundles }}

      - name: 打包安装包（跳过更新包签名）
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: pnpm tauri build --target ${{ inputs.target }} --bundles ${{ inputs.bundles }} --config "$GITHUB_WORKSPACE/.github/tauri-nosign.conf.json"

      # 只收安装包与签名；*.app 目录不入 artifact，避免重复一份未压缩的 bundle。
      # Linux：.AppImage 供手动下载，.AppImage.tar.gz 才是应用内更新用的产物（deb/rpm 不参与自动更新）。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: copicseal-${{ inputs.label }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/${{ inputs.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ inputs.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ inputs.target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ inputs.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ inputs.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ inputs.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ inputs.target }}/release/bundle/**/*.sig
